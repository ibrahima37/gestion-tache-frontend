<div class="modal fade show d-block" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content shadow-lg">
      <!-- Header -->
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ title }}
        </h5>
        <button type="button" class="btn-close" (click)="onCancel()" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body text-center">
        <p class="fw-bold mb-3">{{ message }}</p>
      </div>

      <!-- Footer -->
      <div class="modal-footer d-flex justify-content-center">
        <button type="button" class="btn btn-secondary px-4" (click)="onCancel()">
          <i class="bi bi-x-circle me-2"></i> {{ cancelText }}
        </button>
        <button type="button" class="btn btn-danger px-4" (click)="onConfirm()">
          <i class="bi bi-check-circle me-2"></i> {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
